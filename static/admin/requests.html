<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Requests Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-blue:   #00f2ff;
            --neon-green:  #00ff88;
            --neon-gold:   #ffd27d;
            --neon-red:    #ff4455;
            --bg-dark:     #050505;
            --card-bg:     #111;
            --input-bg:    #0a0a0a;
            --border-dim:  #2a2a2a;
            --border-mid:  #1e3a3f;
            --text:        #e0e0e0;
            --text-muted:  #666;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-dark);
            color: var(--text);
            font-family: 'Share Tech Mono', monospace;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ── Admin Nav ── */
        .admin-nav {
            width: 100%;
            background: linear-gradient(180deg, #151515 0%, #0a0a0a 100%);
            border-bottom: 1px solid var(--neon-blue);
            box-shadow: 0 0 12px rgba(0,242,255,.16);
        }
        .admin-nav-inner {
            max-width: 1200px; margin: 0 auto; padding: 10px 14px;
            display: flex; justify-content: center; gap: 8px; align-items: center; flex-wrap: wrap;
        }
        .admin-nav a {
            text-decoration: none; font-family: 'Orbitron', sans-serif;
            font-size: 0.72rem; letter-spacing: 1px; text-transform: uppercase;
            color: #9ad8df; padding: 6px 10px; border: 1px solid #2b4448; transition: all 0.2s ease;
        }
        .admin-nav a.brand { color: var(--neon-blue); border-color: transparent; padding-left: 0; margin-right: 4px; }
        .admin-nav a:hover { color: #001215; background: var(--neon-blue); border-color: var(--neon-blue); }
        .admin-nav a.active { color: #001215; background: var(--neon-blue); border-color: var(--neon-blue); box-shadow: 0 0 10px rgba(0,242,255,.35); }

        /* ── Scanline ── */
        .scanline {
            width: 100%; height: 100px; z-index: 10;
            background: linear-gradient(0deg, rgba(0,0,0,0) 0%, rgba(255,255,255,.05) 50%, rgba(0,0,0,0) 100%);
            opacity: 0.1; position: fixed; bottom: 100%; left: 0;
            pointer-events: none; animation: scanline 10s linear infinite;
        }
        @keyframes scanline { 0% { bottom: 100%; } 100% { bottom: -100px; } }

        /* ── Header ── */
        header {
            background: #111; padding: 15px;
            border-bottom: 2px solid var(--neon-blue);
            display: flex; justify-content: space-between; align-items: center;
            width: 100%; box-sizing: border-box;
        }
        header h1 {
            font-family: 'Orbitron', sans-serif; letter-spacing: 5px;
            text-transform: uppercase; margin: 0; color: var(--neon-blue);
        }
        header a {
            color: var(--neon-blue); text-decoration: none; font-size: 0.8rem;
            border: 1px solid var(--neon-blue); padding: 5px 12px; transition: all .2s;
        }
        header a:hover { background: var(--neon-blue); color: #001215; }

        /* ── Page layout ── */
        .page-wrap {
            max-width: 1100px; margin: 32px auto; padding: 0 20px 80px;
        }

        /* ── Toolbar ── */
        .toolbar {
            display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 28px; align-items: center;
        }
        .btn {
            font-family: 'Orbitron', sans-serif; font-size: 0.72rem;
            letter-spacing: 1px; text-transform: uppercase;
            padding: 9px 18px; border: 1px solid var(--neon-blue);
            color: var(--neon-blue); background: transparent;
            cursor: pointer; transition: all .2s; text-decoration: none;
            display: inline-flex; align-items: center; gap: 6px;
        }
        .btn:hover { background: var(--neon-blue); color: #001215; }
        .btn:disabled { opacity: .4; cursor: default; pointer-events: none; }
        .btn-green { border-color: var(--neon-green); color: var(--neon-green); }
        .btn-green:hover { background: var(--neon-green); color: #001215; }

        .toolbar-count {
            font-size: 0.75rem; color: var(--text-muted); margin-left: auto;
        }

        /* ── Section heading ── */
        .section-label {
            font-family: 'Orbitron', sans-serif; font-size: 0.7rem;
            letter-spacing: 2px; text-transform: uppercase;
            color: var(--neon-blue); border-bottom: 1px solid var(--border-mid);
            padding-bottom: 7px; margin-bottom: 16px;
        }

        /* ── Request cards ── */
        .requests-panel {
            background: var(--card-bg); border: 1px solid var(--border-mid);
            padding: 18px; min-height: 72px;
        }
        .requests-list { display: flex; flex-direction: column; gap: 10px; }

        .request-card {
            display: flex; align-items: center; gap: 14px;
            background: #0d1a1e; border: 1px solid #1e3a3f;
            padding: 14px; border-radius: 4px; transition: all .2s;
        }
        .request-card.fulfilled {
            border-color: rgba(0,255,136,.25);
            background: rgba(0,255,136,.04);
        }

        .req-checkbox {
            width: 22px; height: 22px; flex-shrink: 0;
            border: 2px solid #3a5a5f; border-radius: 3px;
            background: transparent; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all .2s; font-size: 14px; color: transparent;
        }
        .req-checkbox:hover { border-color: var(--neon-blue); }
        .req-checkbox.checked {
            border-color: var(--neon-green); background: var(--neon-green);
            color: #001215;
        }

        .req-cover {
            width: 44px; height: 44px; object-fit: cover;
            background: #0a0a0a; flex-shrink: 0; border-radius: 3px;
        }
        .req-cover-ph {
            width: 44px; height: 44px; background: #0a0a0a;
            display: flex; align-items: center; justify-content: center;
            color: var(--text-muted); font-size: 1.2rem; border-radius: 3px; flex-shrink: 0;
        }

        .req-content { flex: 1; min-width: 0; }
        .req-series {
            font-family: 'Orbitron', sans-serif; font-size: 0.75rem;
            color: var(--neon-blue); letter-spacing: .5px; font-weight: 700;
        }
        .request-card.fulfilled .req-series {
            text-decoration: line-through; opacity: .6;
        }
        .req-book {
            font-size: 0.72rem; color: var(--neon-gold); margin-top: 2px;
        }
        .request-card.fulfilled .req-book {
            text-decoration: line-through; opacity: .6;
        }
        .req-author { font-size: 0.68rem; color: var(--text-muted); margin-top: 1px; }
        .req-note {
            font-size: 0.68rem; color: #8ab; margin-top: 4px;
            font-style: italic; line-height: 1.3;
        }
        .req-meta {
            font-size: 0.63rem; color: var(--text-muted); margin-top: 4px;
            display: flex; gap: 12px; flex-wrap: wrap;
        }

        /* ── Status pills ── */
        .req-pill {
            display: inline-block; padding: 2px 7px; border-radius: 3px;
            font-size: 0.6rem; font-family: 'Orbitron', sans-serif; font-weight: 700;
            text-transform: uppercase; letter-spacing: .5px; flex-shrink: 0;
        }
        .pill-pending  { background: #4a4a00; color: #ffff88; }
        .pill-fulfilled { background: var(--neon-green); color: #001215; }
        .pill-exists   { background: rgba(0,255,136,.15); color: var(--neon-green); border: 1px solid rgba(0,255,136,.3); }
        .pill-missing  { background: rgba(255,68,85,.1); color: var(--neon-red); border: 1px solid rgba(255,68,85,.25); }

        .req-countdown {
            font-size: 0.6rem; color: var(--text-muted); flex-shrink: 0;
            font-family: 'Orbitron', sans-serif;
        }

        .req-actions { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }
        .req-delete {
            background: none; border: none; color: #3a5a5f; cursor: pointer;
            font-size: 0.85rem; line-height: 1; padding: 0; transition: color .15s;
        }
        .req-delete:hover { color: var(--neon-red); }

        /* ── Spinner ── */
        .spinner {
            display: inline-block; width: 14px; height: 14px;
            border: 2px solid rgba(0,242,255,.2); border-top-color: var(--neon-blue);
            border-radius: 50%; animation: spin .7s linear infinite;
            vertical-align: middle; margin-left: 6px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Toast ── */
        #toast {
            position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
            background: #111; color: var(--neon-blue); border: 1px solid var(--neon-blue);
            padding: 10px 22px; font-family: 'Orbitron', sans-serif; font-size: .75rem;
            letter-spacing: 1px; z-index: 9999; pointer-events: none;
            opacity: 0; transition: opacity .4s; white-space: nowrap;
        }
        #toast.show { opacity: 1; }
    </style>
</head>
<body>

<nav class="admin-nav">
    <div class="admin-nav-inner">
        <a href="/admin" class="brand">System Admin</a>
        <a href="/admin">Hub</a>
        <a href="/admin/forge">Forge</a>
        <a href="/admin/loot">Armory</a>
        <a href="/admin/quest">Bounties</a>
        <a href="/admin/template">Template</a>
        <a href="/admin/setup">Script</a>
        <a href="/admin/ops">Ops</a>
        <a href="/admin/radar">Radar</a>
        <a href="/admin/requests" class="active">Requests</a>
    </div>
</nav>

<div class="scanline"></div>

<header>
    <h1>Requests</h1>
    <a href="/request">[ PUBLIC REQUEST PAGE ]</a>
</header>

<div class="page-wrap">

    <div class="toolbar">
        <button class="btn btn-green" onclick="verifyAll()" id="btn-verify">&#8635; Verify All</button>
        <span class="toolbar-count" id="toolbar-count"></span>
    </div>

    <div class="section-label">// Request Checklist</div>
    <div class="requests-panel">
        <div id="requests-list" class="requests-list">
            <span style="color:var(--text-muted);font-size:.8rem">Loading&hellip;</span>
        </div>
    </div>

</div>

<div id="toast"></div>

<script>
async function loadRequests() {
    try {
        const resp = await fetch('/admin/api/requests');
        const data = await resp.json();
        renderRequests(data.requests || []);
    } catch (e) { console.error(e); }
}

function renderRequests(requests) {
    const container = document.getElementById('requests-list');
    const countEl = document.getElementById('toolbar-count');
    const pending = requests.filter(r => r.status === 'pending').length;
    const fulfilled = requests.filter(r => r.status === 'fulfilled').length;
    countEl.textContent = `${pending} pending · ${fulfilled} fulfilled`;

    if (!requests.length) {
        container.innerHTML = '<span style="color:var(--text-muted);font-size:.8rem">No requests yet. Users can submit requests from the public request page.</span>';
        return;
    }

    container.innerHTML = '';
    requests.forEach(r => {
        const card = document.createElement('div');
        card.className = 'request-card' + (r.status === 'fulfilled' ? ' fulfilled' : '');

        const isFulfilled = r.status === 'fulfilled';
        const coverHtml = r.cover_url
            ? `<img class="req-cover" src="${escHtml(r.cover_url)}" alt="" onerror="this.outerHTML='<div class=req-cover-ph>&#127911;</div>'">`
            : `<div class="req-cover-ph">&#127911;</div>`;

        let metaHtml = `<span>${timeAgo(r.created_at)}</span>`;
        if (isFulfilled && r.fulfilled_at) {
            const daysLeft = Math.max(0, 7 - Math.floor((Date.now()/1000 - r.fulfilled_at) / 86400));
            metaHtml += ` <span class="req-countdown">${daysLeft}d until removed</span>`;
        }

        const pillHtml = isFulfilled
            ? '<span class="req-pill pill-fulfilled">Fulfilled</span>'
            : '<span class="req-pill pill-pending">Pending</span>';

        card.innerHTML = `
            <div class="req-checkbox ${isFulfilled ? 'checked' : ''}"
                 onclick="toggleCheck(${r.id}, ${isFulfilled ? 'true' : 'false'})"
                 title="${isFulfilled ? 'Mark as pending' : 'Mark as fulfilled'}">&#10003;</div>
            ${coverHtml}
            <div class="req-content">
                <div class="req-series">${escHtml(r.series_name)}</div>
                ${r.book_title ? `<div class="req-book">Book: ${escHtml(r.book_title)}</div>` : ''}
                ${r.author ? `<div class="req-author">${escHtml(r.author)}</div>` : ''}
                ${r.note ? `<div class="req-note">"${escHtml(r.note)}"</div>` : ''}
                <div class="req-meta">${metaHtml} ${pillHtml}</div>
            </div>
            <div class="req-actions">
                <button class="req-delete" title="Remove request" onclick="deleteRequest(${r.id}, this)">&#10005;</button>
            </div>`;
        container.appendChild(card);
    });
}

async function toggleCheck(id, currentlyFulfilled) {
    const endpoint = currentlyFulfilled
        ? `/admin/api/requests/${id}/uncheck`
        : `/admin/api/requests/${id}/check`;
    try {
        await fetch(endpoint, { method: 'POST' });
        await loadRequests();
    } catch (e) { console.error(e); }
}

async function deleteRequest(id, btn) {
    if (!confirm('Remove this request?')) return;
    try {
        const resp = await fetch(`/admin/api/requests/${id}`, { method: 'DELETE' });
        if (resp.ok) {
            await loadRequests();
        }
    } catch (e) { console.error(e); }
}

async function verifyAll() {
    const btn = document.getElementById('btn-verify');
    btn.disabled = true;
    btn.innerHTML = `&#8635; Verifying&hellip;<span class="spinner"></span>`;
    try {
        const resp = await fetch('/admin/api/requests/verify', { method: 'POST' });
        const data = await resp.json();
        btn.innerHTML = `&#8635; Verify All`;
        if (data.fulfilled > 0) {
            showToast(`Verified: ${data.fulfilled} of ${data.checked} now in library`);
        } else {
            showToast(`Checked ${data.checked} requests — none found in library yet`);
        }
        await loadRequests();
    } catch (e) {
        btn.innerHTML = `&#8635; Verify All`;
        console.error(e);
    }
    btn.disabled = false;
}

function timeAgo(ts) {
    const secs = Math.floor(Date.now()/1000) - ts;
    if (secs < 60)   return 'just now';
    if (secs < 3600) return Math.floor(secs/60) + 'm ago';
    if (secs < 86400) return Math.floor(secs/3600) + 'h ago';
    return Math.floor(secs/86400) + 'd ago';
}

let _toastTimer;
function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(_toastTimer);
    _toastTimer = setTimeout(() => t.classList.remove('show'), 3500);
}

function escHtml(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

loadRequests();
</script>
</body>
</html>
